# نشر تجريبي على Coolify — منصة حلّل
# الفرع في Coolify: main فقط
# Base Directory: /hollal-platform
# Docker Compose Location: /docker-compose.coolify.yml
#
# Domains for app:
#   https://xxxx.91.98.234.130.sslip.io
# بدون أي منفذ في نهاية الرابط، وافتح الموقع بـ https

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: web
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
    # ممنوع healthcheck على app
    # الخادم يُقلع على 80 فوراً داخل entrypoint لتفادي Bad Gateway
    expose:
      - "80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: queue
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hollal}
      MYSQL_USER: ${DB_USERNAME:-hollal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - hollal_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  hollal_storage:
  hollal_logs:
  hollal_mysql:
