# نشر تجريبي على Coolify — منصة حلّل
# Base Directory: /hollal-platform
# Docker Compose Location: /docker-compose.coolify.yml
# Domains for app: ضع الرابط بدون منفذ (التطبيق يستمع على 80)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: web
      PORT: "80"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:80/up')===false?1:0);\""]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    expose:
      - "80"
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: queue
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTAINER_ROLE: scheduler
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-hollal}
      DB_USERNAME: ${DB_USERNAME:-hollal}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - hollal_storage:/app/storage/app
      - hollal_logs:/app/storage/logs
    depends_on:
      - db
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hollal}
      MYSQL_USER: ${DB_USERNAME:-hollal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    volumes:
      - hollal_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

volumes:
  hollal_storage:
  hollal_logs:
  hollal_mysql:
